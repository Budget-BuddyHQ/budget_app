# Budget Buddy — Supabase project configuration.
#
# WHAT THIS FILE IS FOR
# =====================
# Two of the app's most visible faults were never in the app. They were single
# fields in the Supabase dashboard, which nothing in this repository recorded,
# nothing reviewed, and nothing could catch:
#
#   1. The password-reset email pointed at `http://localhost:3000`, so tapping
#      it on a phone gave "This site can't be reached". The cause was an empty
#      Redirect allow-list: when `redirect_to` is not on the list Supabase does
#      not reject it, it *substitutes the Site URL* — and the Site URL was
#      still the placeholder a new project ships with.
#
#   2. The mail arrived from "Supabase Auth" <noreply@mail.app.supabase.io>,
#      which reads like a phishing attempt to anyone who has never heard of
#      Supabase, and is the sender most likely to be filed as spam.
#
# Putting them here makes them reviewable, diffable, and re-appliable to a new
# project without anybody having to remember. Apply with:
#
#     supabase link --project-ref cwqjduingvevagrxbwts
#     supabase config push
#
# `config.toml` also drives `supabase start` for local development, so the same
# file keeps a local stack behaving like production.

project_id = "cwqjduingvevagrxbwts"

[auth]
enabled = true

# THE FIX FOR THE DEAD RESET LINK.
#
# `site_url` is not only "where the web app lives". It is the value Supabase
# silently falls back to whenever a `redirect_to` fails validation — so it is
# the last thing standing between a misconfigured allow-list and a link that
# goes nowhere. Pointing it at a real page means the worst case is one extra
# tap rather than a connection error.
#
# `docs/password-reset.html` is that page (GitHub Pages, /docs on main). It
# reads the auth payload out of the URL and hands it to `budgetbuddy://`, and
# explains itself if the app is not installed or the link has expired.
site_url = "https://budget-buddyhq.github.io/budget_app/password-reset.html"

# Everything the app is allowed to send somebody back to.
#
# The custom scheme is listed even though `passwordResetRedirectUrl` now sends
# people to the page above instead: the page's whole job is to redirect to it,
# and a future flow (magic link, email change) may want it directly.
#
# **No loopback entries.** There used to be `http://localhost:5960` here for
# the Flutter web dev server, and nothing sends it any more —
# `passwordResetRedirectUrl` is the hosted page on every platform now. An
# unused allow-list entry is not harmless: it is a documented-looking
# invitation to point a real email at an address that resolves on exactly one
# machine, which is the mistake this whole file exists because of.
#
# A deployed web build needs its real origin adding here, not a loopback one.
additional_redirect_urls = [
  "budgetbuddy://password-reset",
  "https://budget-buddyhq.github.io/budget_app/password-reset.html",
]

# An hour. Long enough that a child who asks for a reset, goes to find a
# parent, and comes back still has a working link; short enough to matter.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
enable_confirmations = true
# Changing an account's email confirms on *both* addresses, so somebody who
# gets into an account cannot quietly move it out of reach of its owner.
double_confirm_changes = true

# THE FIX FOR "Supabase Auth" IN THE FROM LINE.
# ============================================
# The sender name and address are **not settable without custom SMTP.** With
# Supabase's built-in mailer the From header is fixed at
# "Supabase Auth" <noreply@mail.app.supabase.io> and no dashboard field
# changes it. That built-in mailer is also rate-limited to a handful of
# messages an hour and is explicitly not for production.
#
# So this needs an SMTP provider. Resend is the shortest path — free tier,
# and it will send from `onboarding@resend.dev` before any domain is verified,
# which is enough to see the change land. Postmark, SES and SendGrid all work
# the same way.
#
#   1. Create the account, take an API key.
#   2. Store the key as a secret, NEVER in this file:
#        supabase secrets set SMTP_PASSWORD=re_your_key_here
#   3. Uncomment the block below and push.
#
# `admin_email` is the From address. **Change it before shipping** — the value
# below is a placeholder for a domain that has to be verified with the
# provider first, or mail from it will be rejected or land in spam. Until the
# domain is verified use the provider's own sandbox sender.
#
# `sender_name` is the display name, and is the one the player actually reads.
#
# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 587
# user = "resend"
# pass = "env(SMTP_PASSWORD)"
# admin_email = "noreply@budgetbuddy.app"   # <- verify this domain first
# sender_name = "Budget Buddy"

# The four templates live in `docs/auth_emails/` and are pasted into the
# dashboard by hand today. Once SMTP is configured they can be pushed from
# here instead, which is the point at which they stop being able to drift:
#
# [auth.email.template.recovery]
# subject = "Reset your Budget Buddy password"
# content_path = "../docs/auth_emails/reset_password.html"
#
# [auth.email.template.confirmation]
# subject = "Confirm your Budget Buddy account"
# content_path = "../docs/auth_emails/confirm_signup.html"
#
# [auth.email.template.magic_link]
# subject = "Your Budget Buddy sign-in link"
# content_path = "../docs/auth_emails/magic_link.html"
#
# [auth.email.template.email_change]
# subject = "Confirm your new Budget Buddy email"
# content_path = "../docs/auth_emails/change_email.html"
