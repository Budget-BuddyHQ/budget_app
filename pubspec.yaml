name: budget_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  window_manager: ^0.5.1
  http: ^1.6.0
  webview_flutter: ^4.8.0
  # Windows-only. See `WindowsTurnstileView` — the desktop captcha used to
  # open the system browser, which is not a sign-in flow, it is a detour.
  webview_windows: ^0.4.0
  boxicons: ^2.1.0
  supabase_flutter: ^2.5.6
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  bonfire: ^3.17.0
  flame: ^1.18.0
  flame_tiled: ^1.20.3
  lottie: ^3.3.0
  flutter_svg: ^2.2.0
  audioplayers: ^6.6.0
  image_picker: ^1.1.2
  cloudflare_turnstile: ^1.0.0
  flutter_3d_controller: ^2.3.0
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.2

flutter:
  uses-material-design: true
  assets:
    # Pixelify Sans and Quicksand, bundled rather than fetched.
    #
    # google_fonts downloads a face on first use and caches it to the device,
    # which means a first launch with no network renders the whole app in the
    # platform fallback — the one state a store reviewer or a child on school
    # wifi is most likely to hit. Dropping the .ttf files into the bundle under
    # the names the package looks for ({Family}-{Weight}.ttf) makes it load
    # them from assets and never reach for the network at all.
    #
    # 572KB for nine faces, and only the weights the package actually resolves
    # to: Pixelify Sans has 400/500/600/700 upstream, so the w800 and w900 call
    # sites in this app already map onto Bold.
    - assets/fonts/
    - assets/images/logo.png
    - assets/images/
    - assets/images/turtles/
    # Generated by tool/make_ui_kit.py — nine-slice frames and buttons with
    # real bevels, plus a hand-drawn 16x16 icon set. See that script for why
    # these are generated rather than drawn by hand.
    - assets/images/ui_kit/
    # Bold italic cartoon numerals for money displays, packed from the
    # underwater UI set by tool/make_hud_five.py (which also rebuilds the
    # digit 5 that never survived the SVG conversion). See MoneyGlyphs.
    - assets/images/hud_font/
    # One portrait per life ending, curated from the Ninja Adventure pack's
    # facesets. Only the seven that ship are copied in — the 3,298-file
    # imported tree stays out of the bundle. See LifeEndingArchetype.portrait.
    - assets/images/ending_faces/
    # The mascot the in-app tutorial speaks through, drawn by
    # tool/make_turtle_skins.py alongside the four turtle skins.
    - assets/images/turtle_guide/
    - assets/images/tiles/
    - assets/images/finance_brawl_ui/
    # Adventure map: Bonfire's TiledAssetReader is hardcoded to read Tiled
    # maps from under assets/images/, so the exported map JSON + its
    # tileset image(s) both live here. See assets/images/maps/README.md.
    - assets/images/maps/
    # Real company logos for the Market Board's "Trending Now" promo strip —
    # sourced from Wikimedia Commons (freely licensed, used here purely to
    # identify the real public company each ticker trades as). See
    # stock_market_page.dart's _kLogoSymbols for which tickers have one.
    - assets/images/stock_logos/
    # Villager sprite sheets (one per body+variant), packed by
    # tool/pack_skin_sheets.ps1 from gitignored intermediate frames.
    - assets/self_made_skins/
    # directory has to be listed on its own.
    - assets/animations/
    - assets/audio/
    - assets/data/
    - assets/icons/
    - assets/imported/pond_loading_animation_source/pond.glb
    - assets/imported/
    - assets/own_skins/
    - assets/own_skins/turtle_celebrate/
    - assets/own_skins/turtle_mentor/
    - assets/self_made_backgrounds/
    - assets/map_assets_coins/PNG_more_map_tiles/
    - assets/map_assets_coins/day-night-cycle/
    # The underwater set (flat vector PNGs despite the folder name): sand
    # floor tiles, seaweed, coral, rocks, fish and bubbles. Home is built out
    # of these — see ReefScene, which also records how much of each 128x128
    # box is actually drawn, since none of them fill it.
    #
    # assets/images/hud_font/ above was already packed from this same set.
    - assets/map_assets_coins/underwater_UI_svgs/
    # Town NPC frames. These are individual 102x116 PNGs per frame (not
    # sprite sheets), so every folder has to be listed on its own —
    # Flutter does not bundle subfolders recursively.
    # Shop/room interiors — the backdrop behind the "you are inside" sheet.
    - assets/map_assets_coins/building/rooms/
    - assets/map_assets_coins/tax-guy/idle/
    - assets/map_assets_coins/tax-guy/walk/
    - assets/map_assets_coins/customer_more_animations/idle/
    - assets/map_assets_coins/customer_more_animations/idle-fancy/
    - assets/map_assets_coins/customer_more_animations/walk/
    - assets/map_assets_coins/customer_more_animations/walk-fancy/
    - assets/map_assets_coins/employee_or_background_character_information/idle/
    - assets/map_assets_coins/employee_or_background_character_information/walk/
    # The market stall and its shopkeeper — idle loop plus a one-shot
    # "sell" animation played when a purchase is made in the Corner Store.
    - assets/map_assets_coins/shop/0/idle/
    - assets/map_assets_coins/shop/0/sell/
    - assets/map_assets_coins/shop/1/idle/
    - assets/map_assets_coins/shop/1/sell/
    - assets/own_skins/mushroom_goomba/walking_animation/

