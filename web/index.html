<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Budget Buddy: learn money by playing.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Budget Buddy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Budget Buddy</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0E2116">
  <style>
    html, body { background-color: #0E2116; margin: 0; height: 100%; }
    /* Shown while the app downloads (it is large, and a judge on a slow
       connection would otherwise see a blank screen for several seconds).
       Removed on Flutter's first frame. */
    #bb-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #0E2116; color: #F4F1E6; z-index: 10;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.35s ease;
    }
    #bb-loading img {
      width: 128px; height: 128px; border-radius: 28px;
      animation: bb-bob 1.6s ease-in-out infinite;
    }
    #bb-loading .title { font-size: 22px; font-weight: 700; }
    #bb-loading .hint { font-size: 14px; color: #C3D3C6; }
    #bb-loading .bar {
      width: 180px; height: 6px; border-radius: 3px; background: #183223;
      overflow: hidden;
    }
    #bb-loading .bar span {
      display: block; width: 40%; height: 100%; border-radius: 3px;
      background: #6CD34A; animation: bb-slide 1.2s ease-in-out infinite;
    }
    @keyframes bb-bob { 50% { transform: translateY(-6px); } }
    @keyframes bb-slide {
      0% { transform: translateX(-110%); } 100% { transform: translateX(260%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #bb-loading img, #bb-loading .bar span { animation: none; }
    }
  </style>
</head>
<body>
  <div id="bb-loading" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="title">Loading Budget Buddy…</div>
    <div class="bar"><span></span></div>
    <div class="hint">Learn money by playing. This takes a few seconds the first time.</div>
  </div>
  <script>
    // Hide the loading screen once the app has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('bb-loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>
  <script>
    // Older builds installed a service worker that kept serving a saved copy
    // of the app after every new deploy. Remove it and its saved files, then
    // load once more so this visit gets the current build.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs.length) return;
        var jobs = regs.map(function (r) { return r.unregister(); });
        if (window.caches) {
          jobs.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }));
        }
        Promise.all(jobs).then(function () { window.location.reload(); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
